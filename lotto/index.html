  <style>
    .lottery-display {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin: 30px 0;
      flex-wrap: wrap;
    }
    
    .lottery-ball {
      position: relative;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 18px;
      border: 2px solid rgba(255,255,255,0.65);
      box-shadow:
        inset 0 4px 10px rgba(255,255,255,0.45),
        inset 0 -8px 12px rgba(0,0,0,0.22),
        0 8px 16px rgba(0,0,0,0.18);
      text-shadow: 0 1px 2px rgba(0,0,0,0.2);
      animation: pop 0.5s ease-out;
    }

    .lottery-ball::before {
      content: "";
      position: absolute;
      top: 7px;
      left: 9px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: rgba(255,255,255,0.38);
      filter: blur(1px);
    }
    
    @keyframes pop {
      0% {
        transform: scale(0);
      }
      50% {
        transform: scale(1.2);
      }
      100% {
        transform: scale(1);
      }
    }

    .lottery-options {
      margin: 20px 0 24px;
      padding: 18px;
      background: #fafafa;
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .lottery-options label {
      display: block;
      margin-bottom: 12px;
      font-weight: 700;
    }

    .fixed-slots {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .fixed-slot {
      width: 100%;
      min-height: 42px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      background: #fff;
      color: var(--text);
    }

    .lottery-mini-list {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      justify-content: center;
    }

    .lottery-mini-ball {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid rgba(255,255,255,0.7);
      box-shadow:
        inset 0 3px 6px rgba(255,255,255,0.32),
        inset 0 -4px 7px rgba(0,0,0,0.15),
        0 4px 8px rgba(0,0,0,0.12);
    }

    .lottery-mini-ball::before {
      content: "";
      position: absolute;
      top: 4px;
      left: 5px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
    }
    
    .lottery-set {
      padding: 15px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin: 10px 0;
      text-align: center;
