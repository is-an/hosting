<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function () {
      try {
        var storedTheme = localStorage.getItem('theme');
        var theme = (storedTheme === 'light' || storedTheme === 'dark')
          ? storedTheme
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
  <title data-i18n="calculator_meta_title">계산기 카테고리 - 무료 온라인 계산기 모음</title>
  <meta name="description" data-i18n-content="calculator_meta_description" content="퍼센트 계산기, 나이 계산기, D-Day 계산기, 전역일 계산기 등 무료 온라인 계산기 모음입니다.">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="./">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div id="site-header"></div>
<main>
    <section class="hero">
      <div class="container">
        <p class="eyebrow" data-i18n="home_eyebrow_calc">무료 온라인 계산기</p>
        <h1 data-i18n="tool_calculator_title">계산기 모음</h1>
        <p class="hero-copy" data-i18n="tool_calculator_desc">필요한 계산을 빠르게 확인할 수 있는 공식 기반 도구들을 한곳에 정리했습니다.</p>
      </div>
    </section>

    <section class="container">
      <div class="tools-grid" data-category="calculator">
        <a href="./percent/" class="tool-card tool-link" data-name="퍼센트">
          <h3 data-i18n="tool_percent_title">퍼센트 계산기</h3>
          <p data-i18n="tool_percent_desc">A의 B%, A는 B의 몇 %, 증감 비율 등을 빠르게 계산합니다.</p>
          <span class="arrow">→</span>
        </a>
        <a href="./age/" class="tool-card tool-link" data-name="나이">
          <h3 data-i18n="tool_age_title">나이 계산기</h3>
          <p data-i18n="tool_age_desc">생년월일을 입력하면 만 나이, 경과 일수, 다음 생일까지의 날짜를 계산합니다.</p>
          <span class="arrow">→</span>
        </a>
        <a href="./dday/" class="tool-card tool-link" data-name="D-Day">
          <h3 data-i18n="tool_dday_title">D-Day 계산기</h3>
          <p data-i18n="tool_dday_desc">목표 날짜를 입력하면 오늘을 기준으로 D-Day까지 남은 날짜를 계산합니다.</p>
          <span class="arrow">→</span>
        </a>
        <a href="./discharge/" class="tool-card tool-link" data-name="전역일">
          <h3 data-i18n="tool_discharge_title">전역일 계산기</h3>
          <p data-i18n="tool_discharge_desc">입대일과 복무기간으로부터 전역일을 계산합니다.</p>
          <span class="arrow">→</span>
        </a>
      </div>
    </section>
  </main>  <div id="ads-slot" class="ads-slot"></div>  <div id="site-footer"></div>
<script src="../../assets/js/i18n.js"></script>
<script src="../../assets/js/common.js"></script>
</body>
</html>
