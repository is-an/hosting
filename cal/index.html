<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>계산기 카테고리 - 무료 온라인 계산기 모음</title>
  <meta name="description" content="퍼센트 계산기, 나이 계산기, D-Day 계산기, 전역일 계산기 등 무료 온라인 계산기 모음입니다.">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="./">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div id="site-header"></div>
<main>
    <section class="hero">
      <div class="container">
        <p class="eyebrow">무료 온라인 계산기</p>
        <h1>계산기 모음</h1>
        <p class="hero-copy">필요한 계산을 빠르게 확인할 수 있는 공식 기반 도구들을 한곳에 정리했습니다.</p>
      </div>
    </section>

    <section class="container">
      <div class="tools-grid" data-category="calculator">
        <a href="./percent/" class="tool-card tool-link" data-name="퍼센트">
          <h3>퍼센트 계산기</h3>
          <p>A의 B%, A는 B의 몇 %, 증감 비율 등을 빠르게 계산합니다.</p>
          <span class="arrow">→</span>
        </a>
        <a href="./age/" class="tool-card tool-link" data-name="나이">
          <h3>나이 계산기</h3>
          <p>생년월일을 입력하면 만 나이, 경과 일수, 다음 생일까지의 날짜를 계산합니다.</p>
          <span class="arrow">→</span>
        </a>
        <a href="./dday/" class="tool-card tool-link" data-name="D-Day">
          <h3>D-Day 계산기</h3>
          <p>목표 날짜를 입력하면 오늘을 기준으로 D-Day까지 남은 날짜를 계산합니다.</p>
          <span class="arrow">→</span>
        </a>
        <a href="./discharge/" class="tool-card tool-link" data-name="전역일">
          <h3>전역일 계산기</h3>
          <p>입대일과 복무기간으로부터 전역일을 계산합니다.</p>
          <span class="arrow">→</span>
        </a>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
<script src="./assets/js/common.js"></script>
</body>
</html>
