<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function () {
      try {
        var storedTheme = localStorage.getItem('theme');
        var theme = (storedTheme === 'light' || storedTheme === 'dark')
          ? storedTheme
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
  <title data-i18n="blog.meta.title">블로그 - is-an 온라인 도구 이야기</title>
  <meta name="description" data-i18n-content="blog.meta.description" content="계산기, 도구, 미니게임과 웹사이트 제작에 관한 소식을 전합니다.">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://is-an.github.io/blog/">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div id="site-header"></div>
  <main>

      <div class="container">

        <h1 data-i18n="blog.title">블로그</h1>
        <p class="hero-copy" data-i18n="blog.copy">온라인 도구를 만들며 얻은 기록과 유용한 정보를 공유합니다.</p>
      </div>
    </section>

    <section class="container blog-list" aria-label="블로그 글 목록">
      <article class="blog-card">

        </div>
        <h2 data-i18n="blog.post.title">정적 웹사이트에 유용한 도구를 추가하는 방법</h2>
        <p data-i18n="blog.post.summary">작은 온라인 도구 사이트를 안정적으로 확장하는 구조와 운영 방법을 정리했습니다.</p>
        <a class="blog-read-link" href="./posts/example/" data-i18n="blog.read">읽기</a>

    </section>
  </main>

  <script src="../assets/js/i18n.js"></script>
  <script src="../assets/js/common.js"></script>
</body>
</html>
