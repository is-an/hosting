<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function () {
      try {
        var storedTheme = localStorage.getItem('theme');
        var theme = (storedTheme === 'light' || storedTheme === 'dark')
          ? storedTheme
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
  <title>예금/적금 이자 계산기 - 만기액 계산 | 무료 온라인 도구</title>
  <meta name="description" content="예금/적금 이자 계산기. 예치금과 이율로부터 이자와 만기 수령액을 계산합니다.">
  <meta name="keywords" content="예금계산, 적금계산, 이자계산, 만기액, 무료 온라인 도구">
  <meta name="robots" content="index,follow">
  
  <link rel="canonical" href="./index.html">
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>
  <div id="site-header"></div>
<main>
    <section class="hero">
      <div class="container">
        <h1>예금/적금 이자 계산기</h1>
        <p class="hero-copy">예치금과 이율로부터 이자와 만기 수령액을 계산합니다.</p>
      </div>
    </section>

    <div class="container">
      <section class="calculator-section">
        <div class="calculator-card">
          <div class="form-group">
            <label for="savingsAmount">예치금 (원)</label>
            <input type="number" id="savingsAmount" placeholder="예: 1000000" step="100000">
          </div>
          
          <div class="form-group">
            <label for="savingsTerm">기간 (개월)</label>
            <input type="number" id="savingsTerm" placeholder="예: 12" step="1">
          </div>
          
          <div class="form-group">
            <label for="savingsRate">연 이율 (%)</label>
            <input type="number" id="savingsRate" placeholder="예: 4.5" step="0.1">
          </div>
          
          <div class="form-group">
            <label for="savingsType">상품 종류</label>
            <select id="savingsType">
              <option value="deposit">정기예금 (단리)</option>
              <option value="savings">적금 (월복리)</option>
            </select>
          </div>

          <div class="button-group">
            <button id="savingsCalcBtn" class="primary-btn">계산하기</button>
            <button id="savingsCopyBtn" class="secondary-btn">복사</button>
            <button id="savingsResetBtn" class="text-button">초기화</button>
          </div>

          <div id="savingsResult" class="result hidden">
            <div class="result-row">
              <span>예상이자 (세후):</span>
              <span id="savingsInterest"></span>
            </div>
            <div class="result-row">
              <span>세전이자:</span>
              <span id="savingsInterestBeforeTax"></span>
            </div>
            <div class="result-row">
              <span>만기액:</span>
              <span id="savingsMaturityAmount"></span>
            </div>
          </div>
        </div>
      </section>

      <section class="faq-section">
        <h2>❓ 자주 묻는 질문</h2>
        <div class="faq-list">
          <div class="faq-item">
            <h4>단리와 복리는 무엇이 다른가요?</h4>
            <p>단리는 원금에만 이자가 붙고, 복리는 이자에도 이자가 붙습니다.</p>
          </div>
        </div>
      </section>
    </div>
  </main>
  <div id="site-footer"></div>
<script src="../../assets/js/i18n.js"></script>
<script src="../../assets/js/common.js"></script>
  <script src="./savings.js"></script>
</body>
</html>
