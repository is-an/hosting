<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function () {
      try {
        var storedTheme = localStorage.getItem('theme');
        var theme = (storedTheme === 'light' || storedTheme === 'dark')
          ? storedTheme
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
  <title>BMI 계산기 - 건강 체중 계산 | 무료 온라인 도구</title>
  <meta name="description" content="BMI 계산기. 키와 체중을 입력하면 BMI와 건강 상태, 적정 체중을 표시합니다.">
  <meta name="keywords" content="BMI계산, 체중계산, 건강지수, 비만도, 무료 온라인 도구">
  <meta name="robots" content="index,follow">
  
  <link rel="canonical" href="./index.html">
  <link rel="stylesheet" href="../../assets/css/style.css">
  <style>
    .bmi-display { font-size: 2.5em; font-weight: bold; text-align: center; margin: 20px 0; }
    .status { display: inline-block; padding: 8px 16px; border-radius: 20px; font-weight: bold; }
    .status.normal { background: #4CAF50; color: white; }
    .status.underweight { background: #2196F3; color: white; }
    .status.overweight { background: #FF9800; color: white; }
    .status.obese { background: #F44336; color: white; }
  </style>
</head>
<body>
  <div id="site-header"></div>
<main>
    <section class="hero">
      <div class="container">
        <h1>BMI 계산기</h1>
        <p class="hero-copy">키와 체중을 입력하면 BMI와 건강 상태를 확인합니다.</p>
      </div>
    </section>

    <div class="container">
      <section class="calculator-section">
        <div class="calculator-card">
          <div class="form-group">
            <label for="bmiHeight">키 (cm)</label>
            <input type="number" id="bmiHeight" placeholder="예: 170" step="0.1">
          </div>
          
          <div class="form-group">
            <label for="bmiWeight">체중 (kg)</label>
            <input type="number" id="bmiWeight" placeholder="예: 65" step="0.1">
          </div>

          <div class="button-group">
            <button id="bmiCalcBtn" class="primary-btn">계산하기</button>
            <button id="bmiCopyBtn" class="secondary-btn">복사</button>
            <button id="bmiResetBtn" class="text-button">초기화</button>
          </div>

          <div id="bmiResult" class="result hidden">
            <div class="bmi-display" id="bmiValue"></div>
            <div style="text-align: center;" id="bmiStatus"></div>
            <div style="text-align: center; margin: 15px 0;" id="idealWeight"></div>
          </div>
        </div>
      </section>

      <section class="faq-section">
        <h2>❓ 자주 묻는 질문</h2>
        <div class="faq-list">
          <div class="faq-item">
            <h4>BMI는 무엇인가요?</h4>
            <p>BMI(체질량지수)는 체중을 키의 제곱으로 나눈 값으로, 18.5~24.9가 정상 범위입니다.</p>
          </div>
        </div>
      </section>
    </div>
  </main>
  <div id="ads-slot" class="ads-slot"></div>
  <div id="site-footer"></div>
<script src="../../assets/js/i18n.js"></script>
<script src="../../assets/js/common.js"></script>
  <script src="./bmi.js"></script>
</body>
</html>
