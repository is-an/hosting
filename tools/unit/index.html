<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function () {
      try {
        var storedTheme = localStorage.getItem('theme');
        var theme = (storedTheme === 'light' || storedTheme === 'dark')
          ? storedTheme
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
  <title>단위 변환기 - 길이, 무게, 온도 변환 | 무료 온라인 도구</title>
  <meta name="description" content="단위 변환기. 길이, 무게, 온도, 면적, 부피, 시간, 데이터 용량을 빠르게 변환합니다.">
  <meta name="keywords" content="단위변환, 길이변환, 무게변환, 온도변환, 단위계산, 무료 온라인 도구">
  <meta name="robots" content="index,follow">
  
  <link rel="canonical" href="./index.html">
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>
  <div id="site-header"></div>
<main>
    <section class="hero">
      <div class="container">
        <h1>단위 변환기</h1>
        <p class="hero-copy">길이, 무게, 온도, 면적, 부피, 시간, 데이터 용량을 변환합니다.</p>
      </div>
    </section>

    <div class="container">
      <section class="calculator-section">
        <div class="calculator-card">
          <div class="form-group">
            <label for="unitType">변환 종류</label>
            <select id="unitType">
              <option value="length">길이</option>
              <option value="weight">무게</option>
              <option value="temperature">온도</option>
              <option value="area">면적</option>
              <option value="volume">부피</option>
              <option value="time">시간</option>
              <option value="data">데이터 용량</option>
            </select>
          </div>

          <div class="unit-input">
            <div class="form-group">
              <label for="unitFrom">값</label>
              <input type="number" id="unitFrom" placeholder="변환할 값" step="any">
            </div>
            <div class="form-group">
              <label for="unitFromUnit">단위</label>
              <select id="unitFromUnit"></select>
            </div>
          </div>

          <button id="unitSwapBtn" class="text-button">⇄ 변환 방향 바꾸기</button>

          <div class="unit-input">
            <div class="form-group">
              <label for="unitTo">변환 결과</label>
              <input type="number" id="unitTo" placeholder="변환 결과" readonly>
            </div>
            <div class="form-group">
              <label for="unitToUnit">단위</label>
              <select id="unitToUnit"></select>
            </div>
          </div>

          <div class="button-group">
            <button id="unitCopyBtn" class="secondary-btn">복사</button>
            <button id="unitResetBtn" class="text-button">초기화</button>
          </div>
        </div>
      </section>

      <section class="faq-section">
        <h2>❓ 자주 묻는 질문</h2>
        <div class="faq-list">
          <div class="faq-item">
            <h4>1 킬로미터는 몇 미터인가요?</h4>
            <p>1 킬로미터는 1,000미터입니다. 이 도구에서 길이를 선택하고 km에서 m로 변환하면 됩니다.</p>
          </div>
        </div>
      </section>
    </div>
  </main>
  <div id="site-footer"></div>
<script src="../../assets/js/i18n.js"></script>
<script src="../../assets/js/common.js"></script>
  <script src="./unit.js"></script>
</body>
</html>
