<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function () {
      try {
        var storedTheme = localStorage.getItem('theme');
        var theme = (storedTheme === 'light' || storedTheme === 'dark')
          ? storedTheme
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
  <title>텍스트 변환 도구 - 대소문자, 공백 제거 | 무료 온라인 도구</title>
  <meta name="description" content="텍스트 변환 도구. 텍스트를 다양한 방식으로 변환하고 처리합니다.">
  <meta name="keywords" content="텍스트변환, 대문자, 소문자, 공백제거, 무료 온라인 도구">
  <meta name="robots" content="index,follow">
  
  <link rel="canonical" href="./index.html">
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>
  <div id="site-header"></div>
<main>
    <section class="hero">
      <div class="container">
        <h1>텍스트 변환 도구</h1>
        <p class="hero-copy">텍스트를 다양한 방식으로 변환하고 처리합니다.</p>
      </div>
    </section>

    <div class="container">
      <section class="calculator-section">
        <div class="calculator-card">
          <div class="form-group">
            <label for="textConvInput">입력 텍스트</label>
            <textarea id="textConvInput" placeholder="변환할 텍스트를 입력하세요." rows="6"></textarea>
          </div>

          <div class="button-group">
            <button id="textRemoveSpaceBtn" class="secondary-btn" style="width: 100%;">공백 제거</button>
            <button id="textRemoveLineBtn" class="secondary-btn" style="width: 100%;">줄바꿈 제거</button>
            <button id="textUpperBtn" class="secondary-btn" style="width: 100%;">대문자</button>
            <button id="textLowerBtn" class="secondary-btn" style="width: 100%;">소문자</button>
            <button id="textTrimBtn" class="secondary-btn" style="width: 100%;">정렬</button>
            <button id="textReverseBtn" class="secondary-btn" style="width: 100%;">역순</button>
          </div>

          <div class="form-group">
            <label for="textConvOutput">변환 결과</label>
            <textarea id="textConvOutput" placeholder="변환된 텍스트가 여기에 표시됩니다." rows="6" readonly></textarea>
          </div>

          <div class="button-group">
            <button id="textConvCopyBtn" class="secondary-btn">복사</button>
            <button id="textConvResetBtn" class="text-button">초기화</button>
          </div>
        </div>
      </section>

      <section class="faq-section">
        <h2>❓ 자주 묻는 질문</h2>
        <div class="faq-list">
          <div class="faq-item">
            <h4>모든 변환이 즉시 적용되나요?</h4>
            <p>아니요, 각 변환 버튼을 클릭해야 변환됩니다.</p>
          </div>
        </div>
      </section>
    </div>
  </main>
  <div id="site-footer"></div>
<script src="../../assets/js/i18n.js"></script>
<script src="../../assets/js/common.js"></script>
  <script src="./textconv.js"></script>
</body>
</html>
