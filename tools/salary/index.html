<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function () {
      try {
        var storedTheme = localStorage.getItem('theme');
        var theme = (storedTheme === 'light' || storedTheme === 'dark')
          ? storedTheme
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
  <title>연봉 계산기 - 세후 실수령액 계산 | 무료 온라인 도구</title>
  <meta name="description" content="연봉 계산기. 연봉을 입력하면 월급, 세전/세후 금액을 계산합니다.">
  <meta name="keywords" content="연봉계산, 급여계산, 세금계산, 실수령액, 무료 온라인 도구">
  <meta name="robots" content="index,follow">
  
  <link rel="canonical" href="./index.html">
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>
  <div id="site-header"></div>
<main>
    <section class="hero">
      <div class="container">
        <h1>연봉 계산기</h1>
        <p class="hero-copy">연봉을 입력하면 월급과 실수령액을 계산합니다.</p>
      </div>
    </section>

    <div class="container">
      <section class="calculator-section">
        <div class="calculator-card">
          <div class="form-group">
            <label for="annualSalary">연봉 (원)</label>
            <input type="number" id="annualSalary" placeholder="예: 30000000" step="100000">
          </div>

          <div class="button-group">
            <button id="salaryCalcBtn" class="primary-btn">계산하기</button>
            <button id="salaryCopyBtn" class="secondary-btn">복사</button>
            <button id="salaryResetBtn" class="text-button">초기화</button>
          </div>

          <div id="salaryResult" class="result hidden">
            <div class="result-row">
              <span>월급 (세전):</span>
              <span id="monthlySalary"></span>
            </div>
            <div class="result-row">
              <span>월 실수령액:</span>
              <span id="monthlyNetSalary"></span>
            </div>
            <div class="result-row">
              <span>연 실수령액:</span>
              <span id="annualNetSalary"></span>
            </div>
          </div>
        </div>
      </section>

      <section class="faq-section">
        <h2>❓ 자주 묻는 질문</h2>
        <div class="faq-list">
          <div class="faq-item">
            <h4>세금은 어떻게 계산되나요?</h4>
            <p>이 도구는 근본적인 세금 모델을 사용합니다. 실제 세금은 개인 상황에 따라 달라질 수 있습니다.</p>
          </div>
        </div>
      </section>
    </div>
  </main>
  <div id="site-footer"></div>
<script src="../../assets/js/i18n.js"></script>
<script src="../../assets/js/common.js"></script>
  <script src="./salary.js"></script>
</body>
</html>
