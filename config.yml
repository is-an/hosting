# GitHub Pages & Jekyll Configuration
# 한국어 텍스트 표시를 위한 설정

# 사이트 정보
title: "무료 온라인 도구 모음"
description: "로또번호 생성기, D-Day 계산기 등 다양한 무료 온라인 도구를 제공합니다"
url: "https://is-an.github.io"
baseurl: ""
author: "is-an"
email: ""

# 마크다운 설정
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: true
  syntax_highlighter: rouge

# Jekyll 설정
permalink: /:title/
timezone: Asia/Seoul

# 빌드 옵션
future: true
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# 배제할 파일/폴더
exclude:
  - .gitignore
  - .DS_Store
  - node_modules
  - Gemfile
  - Gemfile.lock
  - "*.md.bak"

# 포함할 파일/폴더
include:
  - ".well-known"

# 수집 (Collections)
collections_dir: _data
collections:
  tools:
    output: false

# 테마 색상
theme_color: "#222"
brand_color: "#667eea"
