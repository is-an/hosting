<header class="site-header v2-header">
  <div class="container header-inner v2-header-inner">

    <a class="logo v2-logo" href="#" title="홈으로">
      <img src="#" alt="is-an.github.io 홈" class="logo-img v2-logo-img" width="60" height="60">
      <span class="v2-wordmark">is-an</span>
      <span class="v2-wordmark-sub" data-i18n="header_tagline">도구 모음</span>
    </a>

    <button type="button" id="navToggle" class="v2-nav-toggle"
            aria-controls="mainNav" aria-expanded="false"
            data-i18n-aria-label="header_menuLabel" aria-label="메뉴 열기">
      <span class="v2-nav-toggle-bar" aria-hidden="true"></span>
      <span class="v2-nav-toggle-bar" aria-hidden="true"></span>
      <span class="v2-nav-toggle-bar" aria-hidden="true"></span>
    </button>

    <nav class="main-nav v2-nav" id="mainNav" aria-label="주요 메뉴">
      <a href="#" class="nav-link" data-route="home" data-i18n="nav.home">홈</a>
      <a href="#" class="nav-link" data-route="cal" data-i18n="nav.calculator">계산기</a>
      <a href="#" class="nav-link" data-route="tools" data-i18n="nav.tools">도구</a>
      <a href="#" class="nav-link" data-route="games" data-i18n="nav.games">게임</a>
      <a href="#" class="nav-link" data-route="lotto" data-i18n="nav.lotto">로또</a>
      <a href="#" class="nav-link" data-route="saju" data-i18n="nav.saju">사주</a>
    </nav>

    <div class="header-actions v2-header-actions">
      <a href="#" class="v2-header-search" id="headerSearch" data-i18n="home_searchLabel">
        <span class="v2-header-search-icon" aria-hidden="true"></span>
        <span class="v2-header-search-text">도구 검색</span>
      </a>

      <button type="button" id="themeToggle" class="theme-toggle v2-icon-btn" aria-label="다크모드로 전환">
        <span class="theme-toggle-icon" aria-hidden="true">🌙</span>
      </button>

      <div class="lang-switch v2-lang">
        <button
          type="button"
          id="langToggle"
          class="lang-toggle v2-lang-toggle"
          aria-haspopup="listbox"
          aria-expanded="false"
          data-i18n-aria-label="common.language"
          aria-label="언어 선택">
          <span class="lang-current" id="langCurrent">한국어</span>
          <span class="lang-caret" aria-hidden="true">▾</span>
        </button>
        <ul class="lang-dropdown v2-lang-dropdown" id="langDropdown" role="listbox" aria-label="언어 선택">
          <li role="option" data-lang="ko" tabindex="0">한국어</li>
          <li role="option" data-lang="en" tabindex="0">English</li>
          <li role="option" data-lang="zh" tabindex="0">中文</li>
          <li role="option" data-lang="ja" tabindex="0">日本語</li>
        </ul>
      </div>
    </div>
  </div>
</header>
